<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sutee's extras</title>

<!-- FAVICON -->
<link rel="icon" type="image/png+xml" href="favicon.png">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

@font-face {
  font-family: Imagine;
  src: url(Imagine_Earth.ttf);
}


body {
  font-family: Imagine, Tahoma, sans-serif;
  background: #000;
  color: #fff;
  overflow-x: hidden;
}

/* ===== GLOBAL FADE IN ===== */

body {
  animation: fadeIn 1s ease forwards;
  opacity: 0;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

/* ===== NAVIGATION ===== */

nav {
  width: 100%;
  background: #111;
  border-bottom: 2px solid #ff0000;
  padding: 15px 60px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

nav h2 {
  color: #ff3b3b;
}

/* underline animation */
nav ul {
  list-style: none;
  display: flex;
  gap: 25px;
}

nav a {
  color: #fff;
  text-decoration: none;
  font-size: 14px;
  position: relative;
}

nav a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -4px;
  width: 0%;
  height: 2px;
  background: #ff3b3b;
  transition: 0.3s ease;
}

nav a:hover::after {
  width: 100%;
}

.logo img {
  max-height: 24px;
}


.button {
  display: inline-block;
  padding: 14px 25px;
  background: #ff3b3b;
  color: #fff;
  text-decoration: none;
  font-weight: bold;
  transition: 0.2s;
}

.button:hover {
  background: #ff0000;
  transform: translateY(-2px);
}

  .button2 {
  display: inline-block;
  padding: 3px 25px;
  background: #ff3b3b;
  color: #fff;
  text-decoration: none;
  font-weight: bold;
  transition: 0.2s;
}

.button2:hover {
  background: #ff0000;
  text-decoration: underline;
  transform: translateY(-2px);
}

/* ===== SECTIONS ===== */

section {
  padding: 80px 60px;
  border-top: 1px solid #111;
  opacity: 0;
  transform: translateY(20px);
  animation: slideUp 0.8s ease forwards;
}

section:nth-of-type(1) { animation-delay: 0.2s; }
section:nth-of-type(2) { animation-delay: 0.4s; }
section:nth-of-type(3) { animation-delay: 0.6s; }

@keyframes slideUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

section h2 {
  color: #ff3b3b;
  margin-bottom: 20px;
}

.section-content {
  max-width: 800px;
  line-height: 1.6;
  opacity: 0.85;
}

/* ===== FOOTER ===== */

footer {
  background: #111;
  padding: 20px;
  text-align: center;
  border-top: 2px solid #ff0000;
  font-size: 13px;
  opacity: 0.6;
}
</style>
</head>

<body>

<nav>
  <a href="" class="logo">
    <img src="logo.png" alt="Sutee">
  </a>
  <ul>
    <li><a href="#about">About</a></li>
    <li><a href="downloads">Downloads</a></li>
    <li><a href="#projects">Projects</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<section id="about">
  <h2>About</h2>
  <div class="section-content">
 Test site.
  </div>
</section>


<footer>
  © 2026 sutee124.
</footer>

</body>
</html>
