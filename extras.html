<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sutee's extras</title>

<!-- FAVICON -->
<link rel="icon" type="image/png+xml" href="favicon.png">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

@font-face {
  font-family: Imagine;
  src: url(Imagine_Earth.ttf);
}


body {
  font-family: Imagine, Tahoma, sans-serif;
  background: #000;
  color: #fff;
  overflow-x: hidden;
}

/* ===== GLOBAL FADE IN ===== */

body {
  animation: fadeIn 1s ease forwards;
  opacity: 0;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

/* ===== NAVIGATION ===== */

nav {
  width: 100%;
  background: #111;
  border-bottom: 2px solid #ff0000;
  padding: 15px 60px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

nav h2 {
  color: #ff3b3b;
}

/* underline animation */
nav ul {
  list-style: none;
  display: flex;
  gap: 25px;
}

nav a {
  color: #fff;
  text-decoration: none;
  font-size: 14px;
  position: relative;
}

nav a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -4px;
  width: 0%;
  height: 2px;
  background: #ff3b3b;
  transition: 0.3s ease;
}

nav a:hover::after {
  width: 100%;
}

.logo img {
  max-height: 24px;
}


.button {
  display: inline-block;
  padding: 14px 25px;
  background: #ff3b3b;
  color: #fff;
  text-decoration: none;
  font-weight: bold;
  transition: 0.2s;
}

.button:hover {
  background: #ff0000;
  transform: translateY(-2px);
}

  .button2 {
  display: inline-block;
  padding: 3px 25px;
  background: #ff3b3b;
  color: #fff;
  text-decoration: none;
  font-weight: bold;
  transition: 0.2s;
  padding: 0;
  border:none;
  font-family: Imagine;
}

.button2:hover {
  background: #ff0000;
  text-decoration: underline;
  transform: translateY(-2px);
}

canvas {
  border: 2px solid #ff0000;
  background: #ffffff; 
  cursor: crosshair;
  display: block;
}

.tools {
  display: flex;
  gap: 15px;
  align-items: center;
  flex-wrap: wrap;
}

.tools label {
  font-size: 13px;
  color: #ff3b3b;
}

input[type="color"] {
  width: 40px;
  height: 30px;
  border: 2px solid #ff0000;
  background: #111;
  cursor: pointer;
}

input[type="range"] {
  accent-color: #ff3b3b;
}

/* Brush Preview Circle */
#brushPreview {
  width: 20px;
  height: 20px;
  border: 1px solid #ff0000;
  background: #000;
}

input {
  width: 70%;
  padding: 10px;
  background: #111;
  border: 2px solid #ff0000;
  color: #fff;
  font-family: Imagine, Tahoma, sans-serif;
}

input:focus {
  outline: none;
  border-color: #ff3b3b;
}
/* ===== SECTIONS ===== */

section {
  padding: 80px 60px;
  border-top: 1px solid #111;
  opacity: 0;
  transform: translateY(20px);
  animation: slideUp 0.8s ease forwards;
}

section:nth-of-type(1) { animation-delay: 0.2s; }
section:nth-of-type(2) { animation-delay: 0.4s; }
section:nth-of-type(3) { animation-delay: 0.6s; }

@keyframes slideUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

section h2 {
  color: #ff3b3b;
  margin-bottom: 20px;
}

.section-content {
  max-width: 800px;
  line-height: 1.6;
  opacity: 0.85;
}

/* ===== FOOTER ===== */

footer {
  background: #111;
  padding: 20px;
  text-align: center;
  border-top: 2px solid #ff0000;
  font-size: 13px;
  opacity: 0.6;
}
</style>
</head>

<body>

<nav>
  <a href="" class="logo">
    <img src="logo.png" alt="Sutee">
  </a>
  <ul>
    <li><a href="#about">About</a></li>
    <li><a href="downloads">Downloads</a></li>
    <li><a href="#projects">Projects</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<section id="top">
  <h2>Extras</h2>
  <div class="section-content">
 Came from my abandoned StrawPage? Here you can draw in the canvas. (like the strawpage picasso gimmicks thing.)
  </div>
</section>

<section id="draw">
  <h2>Draw Something</h2>
  <div class="section-content">

    <div class="tools">
      <label>Color</label>
      <input type="color" id="colorPicker" value="#000000">

      <label>Brush Size</label>
      <input type="range" id="brushSize" min="1" max="50" value="5">

      <div id="brushPreview"></div>

      <button class="button2" onclick="toggleEraser()">Eraser</button>
      <button class="button2" onclick="clearCanvas()">Clear</button>
      <button class="button2" onclick="saveDrawing()">Save PNG</button>
    </div>

    <br>

    <canvas id="board" width="800" height="400"></canvas>

  </div>
</section>

<section id="ask">
  <h2>Ask Me Anything Beta</h2>
  <div class="section-content">
    <input type="text" id="questionInput" placeholder="Type your question here..." />
    <button class="button2" onclick="submitQuestion()">Send</button>
    <p id="responseMessage" style="margin-top:15px; color:#ff3b3b;"></p>
  </div>
</section>

<footer>
  © 2026 sutee124.
</footer>

<script>
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");

const colorPicker = document.getElementById("colorPicker");
const brushSizeSlider = document.getElementById("brushSize");
const brushPreview = document.getElementById("brushPreview");

let drawing = false;
let currentColor = "#000000";
let brushSize = 5;
let erasing = false;

// ===== INITIAL SETUP =====
updateBrushPreview();

// ===== DRAW EVENTS =====
canvas.addEventListener("mousedown", startDraw);
canvas.addEventListener("mouseup", stopDraw);
canvas.addEventListener("mouseout", stopDraw);
canvas.addEventListener("mousemove", draw);

function startDraw(e) {
  drawing = true;
  ctx.beginPath();
  draw(e);
}

function stopDraw() {
  drawing = false;
  ctx.beginPath();
}

function draw(e) {
  if (!drawing) return;

  ctx.lineWidth = brushSize;
  ctx.lineCap = "round";

  if (erasing) {
    ctx.globalCompositeOperation = "destination-out";
  } else {
    ctx.globalCompositeOperation = "source-over";
    ctx.strokeStyle = currentColor;
  }

  ctx.lineTo(e.offsetX, e.offsetY);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(e.offsetX, e.offsetY);
}

// ===== TOOL CONTROLS =====

colorPicker.addEventListener("input", function() {
  currentColor = this.value;
  erasing = false;
  updateBrushPreview();
});

brushSizeSlider.addEventListener("input", function() {
  brushSize = this.value;
  updateBrushPreview();
});

function toggleEraser() {
  erasing = !erasing;
}

function clearCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// ===== SAVE PNG =====

function saveDrawing() {
  const link = document.createElement("a");
  link.download = "drawing.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
}

// ===== BRUSH PREVIEW =====

function updateBrushPreview() {
  brushPreview.style.width = brushSize + "px";
  brushPreview.style.height = brushSize + "px";
  brushPreview.style.background = currentColor;
}
</script>

<script>
async function submitQuestion() {
  const input = document.getElementById("questionInput");
  const message = document.getElementById("responseMessage");

  const question = input.value.trim();

  if (!question) {
    message.textContent = "Please type something.";
    return;
  }

  message.textContent = "Sending...";

  try {
    const response = await fetch("https://hello.sutee-avp.workers.dev/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ question })
    });

    if (response.ok) {
      message.textContent = "Question sent anonymously!";
      input.value = "";
    } else {
      message.textContent = "Something went wrong.";
    }
  } catch (err) {
    message.textContent = "Error sending question.";
  }
}
</script>
</body>
</html>
