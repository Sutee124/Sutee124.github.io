<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sutee124's github</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 40px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.25);
      backdrop-filter: blur(6px);
    }

    .subtitle {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 12px;
    }

    h1 {
      color: #ff3b3b;
      font-size: 28px;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 12px;
      background: #ff3b3b;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      transition: 0.25s ease;
    }

    a:hover {
      background: #ff0000;
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
    }

    footer {
      margin-top: 18px;
      font-size: 12px;
      opacity: 0.5;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="subtitle">sutee124's unfinished pages</div>

    <h1>
      I'm in a rush right now.<br />
      Please visit my main page instead.
    </h1>

    <a href="https://sutee124.straw.page" target="_blank">Go to main page</a>

    <footer>Thanks for stopping by, I guess.</footer>
  </div>
</body>
</html>
