<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sutee's site</title>

<!-- FAVICON -->
<link rel="icon" type="image/png+xml" href="favicon.png">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

@font-face {
  font-family: Imagine;
  src: url(Imagine_Earth.ttf);
}


body {
  font-family: Imagine, Tahoma, sans-serif;
  background: #000;
  color: #fff;
  overflow-x: hidden;
}

/* ===== GLOBAL FADE IN ===== */

body {
  animation: fadeIn 1s ease forwards;
  opacity: 0;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

/* ===== NAVIGATION ===== */

nav {
  width: 100%;
  background: #111;
  border-bottom: 2px solid #ff0000;
  padding: 15px 60px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

nav h2 {
  color: #ff3b3b;
}

/* underline animation */
nav ul {
  list-style: none;
  display: flex;
  gap: 25px;
}

nav a {
  color: #fff;
  text-decoration: none;
  font-size: 14px;
  position: relative;
}

nav a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -4px;
  width: 0%;
  height: 2px;
  background: #ff3b3b;
  transition: 0.3s ease;
}

nav a:hover::after {
  width: 100%;
}

.logo img {
  max-height: 24px;
}

/* ===== HERO ===== */

.hero {
  height: 90vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px;
  background: linear-gradient(to bottom, #000, #111);
}

.hero h1 {
  font-size: 36px;
  color: #ff3b3b;
  margin-bottom: 20px;
  animation: glowPulse 3s infinite ease-in-out;
}

@keyframes glowPulse {
  0% { text-shadow: 0 0 5px rgba(255,0,0,0.3); }
  50% { text-shadow: 0 0 15px rgba(255,0,0,0.6); }
  100% { text-shadow: 0 0 5px rgba(255,0,0,0.3); }
}

.hero p {
  opacity: 0.8;
  margin-bottom: 25px;
}

.button {
  display: inline-block;
  padding: 14px 25px;
  background: #ff3b3b;
  color: #fff;
  text-decoration: none;
  font-weight: bold;
  transition: 0.2s;
}

.button:hover {
  background: #ff0000;
  transform: translateY(-2px);
}

  .button2 {
  display: inline-block;
  padding: 3px 25px;
  background: #ff3b3b;
  color: #fff;
  text-decoration: none;
  font-weight: bold;
  transition: 0.2s;
}

.button2:hover {
  background: #ff0000;
  text-decoration: underline;
  transform: translateY(-2px);
}

/* ===== SECTIONS ===== */

section {
  padding: 80px 60px;
  border-top: 1px solid #111;
  opacity: 0;
  transform: translateY(20px);
  animation: slideUp 0.8s ease forwards;
}

section:nth-of-type(1) { animation-delay: 0.2s; }
section:nth-of-type(2) { animation-delay: 0.4s; }
section:nth-of-type(3) { animation-delay: 0.6s; }

@keyframes slideUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

section h2 {
  color: #ff3b3b;
  margin-bottom: 20px;
}

.section-content {
  max-width: 800px;
  line-height: 1.6;
  opacity: 0.85;
}

/* ===== PROJECT GRID ===== */

.projects {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  margin-top: 30px;
}

.project-card {
  background: #111;
  padding: 20px;
  border: 1px solid #222;
  transition: 0.25s ease;
}

.project-card:hover {
  border-color: #ff0000;
  transform: translateY(-4px);
}

/* ===== FOOTER ===== */

footer {
  background: #111;
  padding: 20px;
  text-align: center;
  border-top: 2px solid #ff0000;
  font-size: 13px;
  opacity: 0.6;
}
</style>
</head>
<script>
const username = "Sutee124";

fetch(`https://api.github.com/users/${username}/repos?sort=updated`)
  .then(response => response.json())
  .then(repos => {
    const repoContainer = document.getElementById("repo-list");

    repos
      .filter(repo => !repo.fork) // hide forks
      .slice(0, 6) // show latest 6 repos
      .forEach(repo => {
        const card = document.createElement("div");
        card.className = "project-card";

        card.innerHTML = `
          <h3>${repo.name}</h3>
          <p>${repo.description ? repo.description : "No description provided."}</p>
          <a href="${repo.html_url}" target="_blank" class="repo-link">View on GitHub ▶</a>
        `;

        repoContainer.appendChild(card);
      });
  })
  .catch(error => {
    document.getElementById("repo-list").innerHTML =
      "<p>Unable to load repositories.</p>";
    console.error(error);
  });
</script>

    <a href="downloads.html" class="button">Downloads</a>
    <a href="https://www.reddit.com/user/Sutee124/" target="_blank" class="button">Reddit</a>
  </div>
</div>

<section id="about">

 I do random stuffs. Web Developer, Tech tinkering. Whatever you could've think of. Depends on my mood.
  </div>
</section>

<section id="projects">

  </div>
</section>

<section id="contact">
  <h2>Contact</h2>

    <a href="https://www.reddit.com/user/Sutee124/" target="_blank" class="button2">Reddit</a>
  </div>
</section>

</body>
</html>
