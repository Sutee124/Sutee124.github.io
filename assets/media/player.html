<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LittlePlayer Embed</title>
<!--  LittlePlayer Lite  -->
<!-- - littleplayer.net - -->
</head>
<body>

<div></div>
<div></div>

<div>

  <div>
    <div>
      <img src="player/Combat Initiation - Cogito Ergo Sum ~ Conviction.png" alt="Album Cover">
    </div>
    <div>
      <div>Cogito Ergo Sum ~ Conviction</div>
      <div>Combat Initiation<br>Combat Initiation OST</div>
    </div>
  </div>

  <div></div>

  <div>
    <input type="range" id="progressTrack" min="0" max="100" value="0" aria-label="Seek">
    <div>
      <span id="timeElapsed">0:00</span>
      <span id="timeDuration">0:00</span>
    </div>
  </div>

  <div>
    <!-- Rewind 10s -->
    <button id="rewindBtn" title="Rewind 10s">
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="7.5" y="15.5" font-size="5" font-family="sans-serif" fill="currentColor">10</text></svg>
    </button>

    <!-- Play / Pause -->
    <button id="playBtn" title="Play">
      <svg width="24" height="24" id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>

    <!-- Forward 10s -->
    <button id="forwardBtn" title="Forward 10s">
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/><text x="7.5" y="15.5" font-size="5" font-family="sans-serif" fill="currentColor">10</text></svg>
    </button>
  </div>

  <div>
    <span>
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
    </span>
    <input type="range" id="volumeTrack" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
  </div>

</div>

<audio id="audio" preload="metadata">
  <source src="player/Combat Initiation - Cogito Ergo Sum ~ Conviction.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const progressTrack = document.getElementById('progressTrack');
const timeElapsed = document.getElementById('timeElapsed');
const timeDuration = document.getElementById('timeDuration');
const volumeTrack = document.getElementById('volumeTrack');

const PLAY_PATH = 'M8 5v14l11-7z';
const PAUSE_PATH = 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';

function fmt(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

// Play / pause
playBtn.addEventListener('click', () => {
  if (audio.paused) {
    audio.play();
    playIcon.querySelector('path').setAttribute('d', PAUSE_PATH);
  } else {
    audio.pause();
    playIcon.querySelector('path').setAttribute('d', PLAY_PATH);
  }
});

// Time update
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  progressTrack.value = pct;
  timeElapsed.textContent = fmt(audio.currentTime);
});

audio.addEventListener('loadedmetadata', () => {
  timeDuration.textContent = fmt(audio.duration);
});

audio.addEventListener('ended', () => {
  playIcon.querySelector('path').setAttribute('d', PLAY_PATH);
  progressTrack.value = 0;
  timeElapsed.textContent = '0:00';
});

// Seek
progressTrack.addEventListener('input', () => {
  if (Number.isFinite(audio.duration)) audio.currentTime = progressTrack.value / 100 * audio.duration;
});

// Skip
document.getElementById('rewindBtn').addEventListener('click', () => {
  audio.currentTime = Math.max(0, audio.currentTime - 10);
});
document.getElementById('forwardBtn').addEventListener('click', () => {
  audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
});

// Volume
let vol = 0.8;
audio.volume = vol;

volumeTrack.addEventListener('input', () => {
  vol = Number(volumeTrack.value);
  audio.volume = vol;
});
</script>

</body>
</html>
