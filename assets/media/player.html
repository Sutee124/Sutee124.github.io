<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LittlePlayer Embed</title>
<!--  LittlePlayer Lite  -->
<!-- - littleplayer.net - -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap');

:root {
  --red: #e02020;
  --red-dim: rgba(224, 32, 32, 0.15);
  --red-glow: rgba(224, 32, 32, 0.4);
  --bg: #0a0a0a;
  --surface: #111111;
  --surface2: #1a1a1a;
  --border: rgba(255,255,255,0.07);
  --text: #f0f0f0;
  --muted: rgba(255,255,255,0.45);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: var(--bg);
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
}

/* Blurred background */
.background {
  position: fixed;
  inset: 0;
  background: url("player/Combat Initiation - Cogito Ergo Sum ~ Conviction.png") center/cover no-repeat;
  filter: blur(60px) brightness(0.18) saturate(0.6);
  transform: scale(1.3);
  z-index: 0;
}

/* Subtle red vignette */
.vignette {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(10,0,0,0.85) 100%);
  z-index: 0;
}

/* Player card */
.player {
  position: relative;
  z-index: 1;
  width: min(520px, 92vw);
  background: rgba(14, 14, 14, 0.82);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 32px;
  backdrop-filter: blur(20px);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 30px 80px rgba(0,0,0,0.7);
  animation: playerIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
}

@keyframes playerIn {
  from { opacity: 0; transform: translateY(24px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* Top row: album + meta */
.top-row {
  display: flex;
  gap: 20px;
  align-items: flex-start;
  margin-bottom: 28px;
}

.album-wrap {
  position: relative;
  flex-shrink: 0;
}

.album-art {
  width: 88px;
  height: 88px;
  object-fit: cover;
  border-radius: 3px;
  display: block;
  box-shadow: 0 8px 24px rgba(0,0,0,0.6);
}

/* Spinning ring when playing */
.album-ring {
  position: absolute;
  inset: -5px;
  border-radius: 50%;
  border: 2px solid transparent;
  border-top-color: var(--red);
  border-right-color: var(--red-glow);
  opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
  animation: spin 2.5s linear infinite paused;
}

body.playing .album-ring {
  opacity: 1;
  animation-play-state: running;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.meta {
  flex: 1;
  padding-top: 4px;
}

.track-title {
  font-family: 'Open Sans', sans-serif;
  font-size: 22px;
  letter-spacing: 0.04em;
  line-height: 1.1;
  margin-bottom: 6px;
  color: #fff;
}

.track-sub {
  font-size: 12px;
  color: var(--muted);
  font-weight: 300;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  line-height: 1.5;
}

/* Red accent line */
.divider {
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, var(--red) 0%, transparent 70%);
  margin-bottom: 22px;
  opacity: 0.6;
}

/* Progress bar */
.progress-area {
  margin-bottom: 18px;
}

.progress-track {
  position: relative;
  width: 100%;
  height: 3px;
  background: var(--surface2);
  border-radius: 2px;
  cursor: pointer;
  margin-bottom: 8px;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--red), #ff5555);
  border-radius: 2px;
  position: relative;
  transition: width 0.1s linear;
  box-shadow: 0 0 8px var(--red-glow);
}

.progress-fill::after {
  content: '';
  position: absolute;
  right: -5px;
  top: 50%;
  transform: translateY(-50%);
  width: 10px;
  height: 10px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 0 6px var(--red-glow);
  opacity: 0;
  transition: opacity 0.2s;
}

.progress-track:hover .progress-fill::after {
  opacity: 1;
}

.time-row {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
}

/* Controls */
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
}

.ctrl-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--muted);
  padding: 6px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.2s, transform 0.15s;
  outline: none;
}

.ctrl-btn:hover {
  color: #fff;
  transform: scale(1.1);
}

.ctrl-btn svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

/* Play button */
.play-btn {
  width: 52px;
  height: 52px;
  background: var(--red);
  border: none;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
  box-shadow: 0 4px 20px var(--red-glow);
  outline: none;
}

.play-btn:hover {
  background: #ff2828;
  transform: scale(1.06);
  box-shadow: 0 6px 28px var(--red-glow);
}

.play-btn:active {
  transform: scale(0.96);
}

.play-btn svg {
  width: 20px;
  height: 20px;
  fill: #fff;
  transition: transform 0.15s;
}

/* Volume row */
.volume-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 20px;
}

.vol-icon {
  color: var(--muted);
  flex-shrink: 0;
}

.vol-icon svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
  display: block;
}

.volume-track {
  flex: 1;
  height: 3px;
  background: var(--surface2);
  border-radius: 2px;
  cursor: pointer;
  position: relative;
}

.volume-fill {
  height: 100%;
  width: 80%;
  background: var(--surface2);
  border-radius: 2px;
  background: linear-gradient(90deg, rgba(224,32,32,0.7), rgba(224,32,32,0.4));
  position: relative;
}

.volume-fill::after {
  content: '';
  position: absolute;
  right: -4px;
  top: 50%;
  transform: translateY(-50%);
  width: 8px;
  height: 8px;
  background: var(--muted);
  border-radius: 50%;
  transition: background 0.2s;
}

.volume-track:hover .volume-fill::after {
  background: #fff;
}
</style>
</head>
<body>

<div class="background"></div>
<div class="vignette"></div>

<div class="player">

  <div class="top-row">
    <div class="album-wrap">
      <img src="player/Combat Initiation - Cogito Ergo Sum ~ Conviction.png" alt="Album Cover" class="album-art">
      <div class="album-ring"></div>
    </div>
    <div class="meta">
      <div class="track-title">Cogito Ergo Sum ~ Conviction</div>
      <div class="track-sub">Combat Initiation<br>Combat Initiation OST</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="progress-area">
    <div class="progress-track" id="progressTrack">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="time-row">
      <span id="timeElapsed">0:00</span>
      <span id="timeDuration">0:00</span>
    </div>
  </div>

  <div class="controls">
    <!-- Rewind 10s -->
    <button class="ctrl-btn" id="rewindBtn" title="Rewind 10s">
      <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="7.5" y="15.5" font-size="5" font-family="sans-serif" fill="currentColor">10</text></svg>
    </button>

    <!-- Play / Pause -->
    <button class="play-btn" id="playBtn" title="Play">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>

    <!-- Forward 10s -->
    <button class="ctrl-btn" id="forwardBtn" title="Forward 10s">
      <svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/><text x="7.5" y="15.5" font-size="5" font-family="sans-serif" fill="currentColor">10</text></svg>
    </button>
  </div>

  <div class="volume-row">
    <span class="vol-icon">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
    </span>
    <div class="volume-track" id="volumeTrack">
      <div class="volume-fill" id="volumeFill"></div>
    </div>
  </div>

</div>

<audio id="audio" preload="metadata">
  <source src="player/Combat Initiation - Cogito Ergo Sum ~ Conviction.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const progressFill = document.getElementById('progressFill');
const progressTrack = document.getElementById('progressTrack');
const timeElapsed = document.getElementById('timeElapsed');
const timeDuration = document.getElementById('timeDuration');
const volumeTrack = document.getElementById('volumeTrack');
const volumeFill = document.getElementById('volumeFill');

const PLAY_PATH = 'M8 5v14l11-7z';
const PAUSE_PATH = 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';

function fmt(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

// Play / pause
playBtn.addEventListener('click', () => {
  if (audio.paused) {
    audio.play();
    playIcon.querySelector('path').setAttribute('d', PAUSE_PATH);
    document.body.classList.add('playing');
  } else {
    audio.pause();
    playIcon.querySelector('path').setAttribute('d', PLAY_PATH);
    document.body.classList.remove('playing');
  }
});

// Time update
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  progressFill.style.width = pct + '%';
  timeElapsed.textContent = fmt(audio.currentTime);
});

audio.addEventListener('loadedmetadata', () => {
  timeDuration.textContent = fmt(audio.duration);
});

audio.addEventListener('ended', () => {
  playIcon.querySelector('path').setAttribute('d', PLAY_PATH);
  document.body.classList.remove('playing');
  progressFill.style.width = '0%';
  timeElapsed.textContent = '0:00';
});

// Seek
progressTrack.addEventListener('click', (e) => {
  const rect = progressTrack.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
});

// Skip
document.getElementById('rewindBtn').addEventListener('click', () => {
  audio.currentTime = Math.max(0, audio.currentTime - 10);
});
document.getElementById('forwardBtn').addEventListener('click', () => {
  audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
});

// Volume
let vol = 0.8;
audio.volume = vol;
volumeFill.style.width = (vol * 100) + '%';

volumeTrack.addEventListener('click', (e) => {
  const rect = volumeTrack.getBoundingClientRect();
  vol = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  audio.volume = vol;
  volumeFill.style.width = (vol * 100) + '%';
});
</script>

</body>
</html>
